extends: default

# Helm templates are not valid YAML until rendered; `just lint` validates the
# rendered output with kubeconform instead.
ignore: |
  platform/app-of-apps/templates/

rules:
  document-start: disable
  line-length:
    max: 120
  indentation:
    spaces: 2
    indent-sequences: true
  truthy:
    # GitHub Actions uses `on:` as a key.
    check-keys: false
