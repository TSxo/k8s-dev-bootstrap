name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint and bootstrap on Kind
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Every step runs inside the Nix dev shell, so CI uses the same pinned
    # tools as `nix develop` locally.
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    env:
      # Sync the commit under test, from the repository it was pushed to.
      REPO_URL: ${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
      REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.0.0
      - run: just lint
      - run: just up "$REVISION"
      - run: just demo
      - name: Diagnostics
        if: failure()
        run: just status
