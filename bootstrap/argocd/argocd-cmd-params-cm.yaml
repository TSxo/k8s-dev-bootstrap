# Serve the Argo CD API and UI over plain HTTP.
#
# Local development only: traffic stays on 127.0.0.1 through `just argo-ui` or
# the gateway. Do not use this setting on a shared or remote cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
data:
  server.insecure: "true"
