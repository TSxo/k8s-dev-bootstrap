# Restore the health check for Application resources.
#
# Argo CD removed it in v1.8. Without it, an app-of-apps ignores sync waves on
# child Applications: the gateway config would sync before Envoy Gateway has
# installed its CRDs. Snippet from the Argo CD "Resource Health" docs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
