# Single-node Kind cluster.
#
# The node image is pinned by digest, as the kind release notes require, to the
# image built for kind v0.33.0 (Kubernetes v1.37.0).
#
# Port 30080 is the Envoy Gateway NodePort (see platform/gateway/envoyproxy.yaml).
# It is published on 127.0.0.1:8080 only, so nothing needs root and nothing is
# exposed beyond this machine.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
